version: 2

project_name: ditto-cli

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: ditto-cli
    main: .
    binary: ditto-cli
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/rfcku/ditto-cli/cmd.version={{ .Version }} -X github.com/rfcku/ditto-cli/cmd.commit={{ .Commit }} -X github.com/rfcku/ditto-cli/cmd.buildDate={{ .Date }}

archives:
  - id: ditto-cli-archive
    ids:
      - ditto-cli
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}
    files:
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^Merge pull request'
      - '^Merge branch'

release:
  draft: false
  prerelease: auto

snapshot:
  version_template: "{{ .Tag }}-next"
